
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xat flotante</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: Arial, sans-serif;
}

/* CONTENEDOR PRINCIPAL */
.xat-floating-box {
  position: fixed;
  left: -450px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  transition: left 0.4s ease;
  z-index: 99999;
}

/* ABRIR AL PASAR EL MOUSE */
.xat-floating-box:hover {
  left: 0;
}

/* PESTAÑA */
.xat-tab {
  width: 44px;
  height: 55px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #5865F2;
  border-radius: 0 8px 8px 0;
  cursor: pointer;
  order: 2;
  box-shadow: 2px 2px 8px rgba(0,0,0,.25);
}

/* VENTANA DEL CHAT */
.xat-content {
  width: 450px;
  height: 386px;
  flex-shrink: 0;
  background: #fff;
  border: 2px solid #5865F2;
  border-right: none;
  overflow: hidden;
  order: 1;
  box-shadow: 2px 2px 10px rgba(0,0,0,.2);
}

/* IFRAME XAT */
.xat-content iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}

/* MÓVILES */
@media (max-width: 600px) {
  .xat-floating-box {
    display: none;
  }
}
</style>
</head>

<body>

<div class="xat-floating-box">

  <div class="xat-tab">
    <svg viewBox="0 0 24 24">
      <path d="M12 2C6.48 2 2 6.03 2 11c0 2.23.94 4.25 2.48 5.72L4 22l5.03-2.52c.95.33 1.94.52 2.97.52 5.52 0 10-4.03 10-9S17.52 2 12 2zm-5 10a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/>
    </svg>
  </div>

  <div class="xat-content">
    <iframe src="https://xat.com/embed/chat.php#id=218014227&gn=juegoslan" allow="clipboard-write" width="100%" height="100%" frameborder="0" scrolling="no"></iframe>
  </div>

</div>

</body>
</html>
